# Replace with repositories you own. Enable one initially.
max_repositories_per_run: 1
repositories:
  - repo: aditya42/synthetic-test-data-generator
    enabled: true
    validation:
      image: node:22
      timeout_seconds: 900
      commands:
        - npm ci
        - npm test
        - npm run build
        - npm run test:smoke

  - repo: YOUR_GITHUB_USERNAME/YOUR_PLAYWRIGHT_REPOSITORY
    enabled: false
    validation:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      timeout_seconds: 1200
      commands:
        - npm ci
        - npm run lint --if-present
        - npm run typecheck --if-present
        - npx playwright test --project=chromium

  - repo: YOUR_GITHUB_USERNAME/YOUR_JAVA_REPOSITORY
    enabled: false
    validation:
      image: maven:3.9-eclipse-temurin-21
      timeout_seconds: 1200
      commands:
        - mvn -B verify
